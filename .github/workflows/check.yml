name: 연결 확인

on:
  workflow_dispatch:
  schedule:
    - cron: "5 23 * * 0"   # 매주 월요일 08:05 KST

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - name: 계정·토큰 확인
        env:
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
        run: python scripts/check_account.py
      - name: 발행 대기 목록
        run: python scripts/publish.py --dry-run
      - if: always()
        run: |
          git config user.name "315tools-social bot"
          git config user.email "actions@users.noreply.github.com"
          git add reports
          git diff --cached --quiet || { git commit -m "계정 현황 $(date +%F)"; git pull --rebase; git push; }
